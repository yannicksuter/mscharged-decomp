name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # This is a *private* build container.
    # See docs/github_actions.md for more information.
    container: ghcr.io/yannicksuter/mscharged-decomp-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [R4QE01, R4QP01_rev1, R4QP01_rev2]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      id: originals
      env:
        VERSION: ${{ matrix.version }}
      run: |
        if [ ! -f "/orig/$VERSION/sys/main.dol" ]; then
          if [ "$VERSION" = R4QE01 ]; then
            echo "::error::The private build container is missing the USA original."
            exit 1
          fi
          echo "::notice::Add orig/$VERSION/sys/main.dol to the private build container to enable this revision."
          echo "available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p "orig/$VERSION/sys"
        cp "/orig/$VERSION/sys/main.dol" "orig/$VERSION/sys/main.dol"
        echo "available=true" >> "$GITHUB_OUTPUT"

    # Restore cached files
    - name: Cache build
      if: steps.originals.outputs.available == 'true'
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      if: steps.originals.outputs.available == 'true'
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja

    # Upload map files
    - name: Upload map
      if: steps.originals.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      if: steps.originals.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
